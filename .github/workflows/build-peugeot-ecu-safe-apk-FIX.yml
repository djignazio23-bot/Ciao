name: Build Peugeot ECU SAFE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PEUGEOT_208_ECU_SAFE_ANDROID_v1_SOURCE.zip"
      - ".github/workflows/build-peugeot-ecu-safe-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager non trovato"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f PEUGEOT_208_ECU_SAFE_ANDROID_v1_SOURCE.zip
          unzip -t PEUGEOT_208_ECU_SAFE_ANDROID_v1_SOURCE.zip

      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_src
          mkdir -p build_src
          unzip -q PEUGEOT_208_ECU_SAFE_ANDROID_v1_SOURCE.zip -d build_src

          test -f build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1/settings.gradle.kts
          test -f build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1/build.gradle.kts
          test -f build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1/app/build.gradle.kts

          echo "Progetto estratto correttamente:"
          find build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1 -maxdepth 4 -type f | sort

      - name: Gradle version
        run: gradle --version

      - name: Build debug APK
        working-directory: build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot-208-ECU-SAFE-Android-v1
          path: build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
