name: Build cTrader ALGO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/build-algo.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile .algo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore MultiSymbolReactiveEmaRsiAtrBot.csproj

      - name: Build cBot and generate .algo
        run: >-
          dotnet build MultiSymbolReactiveEmaRsiAtrBot.csproj
          --configuration Release
          --no-restore
          -p:AlgoBuild=true
          -p:AlgoPublish=false
          -p:IncludeSource=true

      - name: Locate generated .algo
        shell: bash
        run: |
          echo "Generated ALGO files:"
          find . -type f -name '*.algo' -print
          mkdir -p artifact
          mapfile -t files < <(find . -type f -name '*.algo')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no .algo file was generated."
            exit 1
          fi
          cp "${files[@]}" artifact/

      - name: Upload .algo
        uses: actions/upload-artifact@v4
        with:
          name: MultiSymbolReactiveEmaRsiAtrBot-ALGO
          path: artifact/*.algo
          if-no-files-found: error
          retention-days: 30
