name: Build cTrader ALGO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MultiSymbolReactive_Project.zip'
      - '.github/workflows/build-algo24.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile .algo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bot
          mkdir -p bot
          unzip -o MultiSymbolReactive_Project.zip -d bot
          echo "=== Extracted files ==="
          find bot -maxdepth 3 -type f -print
          test -f bot/MultiSymbolReactiveEmaRsiAtrBot.csproj
          test -f bot/MultiSymbolReactiveEmaRsiAtrBot.cs

      - name: Restore NuGet packages
        run: dotnet restore bot/MultiSymbolReactiveEmaRsiAtrBot.csproj

      - name: Build cBot and generate .algo
        run: >-
          dotnet build bot/MultiSymbolReactiveEmaRsiAtrBot.csproj
          --configuration Release
          --no-restore
          -p:AlgoBuild=true
          -p:AlgoPublish=false
          -p:IncludeSource=true

      - name: Locate generated .algo
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Generated ALGO files ==="
          find bot -type f -name '*.algo' -print
          mkdir -p artifact
          mapfile -t files < <(find bot -type f -name '*.algo')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no .algo file was generated."
            exit 1
          fi
          cp "${files[@]}" artifact/

      - name: Upload .algo
        uses: actions/upload-artifact@v4
        with:
          name: MultiSymbolReactiveEmaRsiAtrBot-ALGO
          path: artifact/*.algo
          if-no-files-found: error
          retention-days: 30
