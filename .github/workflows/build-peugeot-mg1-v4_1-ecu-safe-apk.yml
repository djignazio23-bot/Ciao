name: Build Peugeot MG1 Post-Distribution v4.1 ECU SAFE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: ECU SAFE static checks
        shell: bash
        run: |
          set -euo pipefail
          F="app/src/main/java/com/peugeot208/boschservice/MainActivity.kt"
          grep -q 'ATSP6' "$F"
          grep -q 'ATSH7E0' "$F"
          grep -q 'ATSH6A8' "$F"
          grep -q 'MIN_INTER_COMMAND_MS = 550L' "$F"
          grep -q 'MAX_COMMANDS_PER_OPERATION = 48' "$F"
          grep -q 'NRC 0x78' "$F"
          grep -q 'override fun onStop' "$F"
          grep -q '22D418' "$F"
          grep -q '22D620' "$F"
          ! grep -q 'ATSH7DF' "$F"
          ! grep -q '"ATSP0"' "$F"
          ! grep -q '"1101"' "$F"
          ! grep -q '"2701"' "$F"
          ! grep -q '"3101' "$F"
          ! grep -q '"04"' "$F"
          ! grep -q '"08"' "$F"
          ! grep -q 'ATPC' "$F"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot-MG1-Post-Distribution-v4_1-ECU-SAFE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
