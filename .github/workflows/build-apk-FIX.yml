name: Build Peugeot 208 Technician v2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Peugeot project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Peugeot208_Technician_v2_BT_BLE_USB_SOURCE.zip -d project
          test -f project/Peugeot208_Technician_Android_v2_GITHUB/settings.gradle.kts

      - name: Run unit tests
        working-directory: project/Peugeot208_Technician_Android_v2_GITHUB
        run: gradle --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: project/Peugeot208_Technician_Android_v2_GITHUB
        run: gradle --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot208-Technician-v2-BT-BLE-USB
          path: project/Peugeot208_Technician_Android_v2_GITHUB/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
