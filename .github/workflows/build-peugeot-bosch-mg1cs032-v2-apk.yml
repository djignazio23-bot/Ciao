name: Build Peugeot 208 Bosch MG1CS032 SAFE v2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2_SOURCE.zip"
      - ".github/workflows/build-peugeot-bosch-mg1cs032-v2-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify ZIP
        run: |
          set -euo pipefail
          test -f PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2_SOURCE.zip
          unzip -t PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2_SOURCE.zip

      - name: Extract
        run: |
          set -euo pipefail
          rm -rf build_src
          mkdir build_src
          unzip -q PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2_SOURCE.zip -d build_src
          test -f build_src/PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2/settings.gradle.kts
          test -f build_src/PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2/app/build.gradle.kts
          test -f build_src/PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2/app/src/main/java/com/peugeot208/boschsafe/MainActivity.kt

      - name: Build APK
        working-directory: build_src/PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="build_src/PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot-208-Bosch-MG1CS032-SAFE-v2
          path: build_src/PEUGEOT_208_BOSCH_MG1CS032_SAFE_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
