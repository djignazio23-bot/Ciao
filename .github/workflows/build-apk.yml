name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: |
          unzip Peugeot208OBDTool_Professional_GitHub_v2.4.zip -d project

      - name: Build APK
        working-directory: project/Peugeot208OBDTool_Professional_GitHub
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 208-OBD-PRO-APK
          path: project/Peugeot208OBDTool_Professional_GitHub/app/build/outputs/apk/debug/*.apk
