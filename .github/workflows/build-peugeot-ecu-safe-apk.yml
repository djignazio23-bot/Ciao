name: Build Peugeot ECU SAFE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PEUGEOT_208_ECU_SAFE_ANDROID_v1_SOURCE.zip"
      - ".github/workflows/build-peugeot-ecu-safe-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android source
        run: |
          rm -rf build_src
          mkdir build_src
          unzip -q PEUGEOT_208_ECU_SAFE_ANDROID_v1_SOURCE.zip -d build_src
          echo "Estratto:"
          find build_src -maxdepth 3 -type f | sort | head -100

      - name: Build debug APK
        working-directory: build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Show APK
        run: |
          find build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot-208-ECU-SAFE-Android-v1
          path: build_src/PEUGEOT_208_ECU_SAFE_ANDROID_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
