name: Build AdaptiveTraderV3
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/build-algo.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'
      - name: Restore
        run: dotnet restore src/AdaptiveTraderV3.csproj
      - name: Build cTrader algo
        run: dotnet build src/AdaptiveTraderV3.csproj -c Release -p:AlgoBuild=true -p:AlgoPublish=false -p:IncludeSource=true
      - name: Locate algo
        shell: pwsh
        run: Get-ChildItem -Path . -Recurse -Filter *.algo | Select-Object FullName,Length
      - name: Upload algo artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveTraderV3-algo
          path: '**/*.algo'
          if-no-files-found: error
